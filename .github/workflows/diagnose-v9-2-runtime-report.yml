name: Diagnose D12 Scoreboard V9.2 runtime report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v9-2-runtime-report.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run diagnostic and save report
        run: |
          python3 -m http.server 8080 >/tmp/d12-http.log 2>&1 &
          cat > diag.js <<'JS'
          const { chromium } = require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const lines=[];
            page.on('pageerror',e=>lines.push('PAGEERROR: '+e.message+'\n'+(e.stack||'')));
            page.on('console',m=>{ if(['error','warning'].includes(m.type())) lines.push('CONSOLE '+m.type().toUpperCase()+': '+m.text()); });
            page.on('requestfailed',r=>lines.push('REQUEST FAILED: '+r.url()+' :: '+(r.failure()?.errorText||'')));
            try{
              await page.goto('http://127.0.0.1:8080/app-v9-2.html?diag=3',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(12000);
              const state=await page.evaluate(()=>({title:document.title,appText:document.getElementById('app')?.innerText||'',appHTMLLength:(document.getElementById('app')?.innerHTML||'').length,bodyClass:document.body.className,tabs:document.getElementById('tabs')?.innerText||'',supabase:typeof window.supabase,ready:document.readyState}));
              lines.unshift('STATE='+JSON.stringify(state));
            }catch(e){lines.unshift('DIAGNOSTIC_EXCEPTION: '+e.stack);}
            fs.writeFileSync('runtime-diagnostic.txt',lines.join('\n---\n'));
            await browser.close();
          })();
          JS
          node diag.js || true
      - name: Commit runtime diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-diagnostic.txt
          git commit -m "Add V9.2 browser runtime diagnostic report" || exit 0
          git push
