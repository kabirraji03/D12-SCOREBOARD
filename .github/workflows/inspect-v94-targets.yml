name: Inspect V9.4 Targets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-v94-targets.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact target snippets
        shell: python
        run: |
          from pathlib import Path
          s=Path('app-v9-3.html').read_text()
          for pat in ["d12OpenContext('clock')","d12OpenContext('more')",'BALL PLAYED','Foul Count','FOUL COUNT','CENTURY','MAXIMUM 147']:
            print('\n###',pat)
            pos=0
            for n in range(5):
              i=s.find(pat,pos)
              if i<0: break
              print(s[max(0,i-500):min(len(s),i+1300)])
              pos=i+len(pat)
