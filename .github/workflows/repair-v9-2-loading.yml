name: Repair D12 Scoreboard V9.2 Loading
on:
  push:
    paths:
      - '.github/workflows/repair-v9-2-loading.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Supabase browser loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')
          s=s.replace('https://unpkg.com/@supabase/supabase-js@2.115.0/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix Version 9.2 Supabase browser loading"
          git push
