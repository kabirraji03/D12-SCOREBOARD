name: Publish D12 Scoreboard Version 9.4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v9-4.yml','scripts/build_v94.py']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Version 9.4
        run: python scripts/build_v94.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app-v9-4.html').read_text()
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I))
          Path('/tmp/d12-v94.js').write_text(js)
          PY
          node --check /tmp/d12-v94.js
      - name: Install browser test
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Browser smoke test
        run: |
          python3 -m http.server 8080 >/tmp/d12-http.log 2>&1 &
          cat > smoke-v94.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1700,height:900}});const errs=[];p.on('pageerror',e=>errs.push(e.message));await p.goto('http://127.0.0.1:8080/app-v9-4.html',{waitUntil:'domcontentloaded'});await p.waitForTimeout(2500);const text=await p.locator('#app').innerText();if(!text.trim())throw new Error('Blank app');if(errs.length)throw new Error('Runtime errors: '+errs.join(' | '));await b.close();})();
          JS
          node smoke-v94.js
      - name: Update live index
        shell: python
        run: |
          from pathlib import Path
          Path('index.html').write_text('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><title>D12 Cuesports Score Board V9.4</title><script>location.replace("app-v9-4.html?v=9400")</script></head><body><p>Loading D12 Cuesports Score Board Version 9.4…</p></body></html>')
      - name: Commit live Version 9.4
        run: |
          git config user.name "D12 Scoreboard Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add app-v9-4.html index.html
          git commit -m "Publish D12 Scoreboard Version 9.4"
          git push