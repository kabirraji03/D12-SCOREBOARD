<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>D12 Cue Club Membership V2.1</title>
<link rel="stylesheet" href="app-v2-1.css?v=2101">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js" defer></script>
<script src="app-v2-1.js?v=2101" defer></script>
</head>
<body>
<section id="publicStatus" class="auth-shell hidden"></section>
<section id="welcome" class="auth-shell">
  <div class="welcome">
    <header class="welcome-head"><div class="welcome-logo">D12</div><h1>D12 Membership</h1><p>Choose how you want to access the club membership system.</p></header>
    <div class="access-grid">
      <button class="access-card admin" data-login="admin"><div class="access-icon">◆</div><h2>Admin Login</h2><p>Full control of members, payments, plans, renewals, cards and system settings.</p></button>
      <button class="access-card user" data-login="user"><div class="access-icon">◎</div><h2>User Login</h2><p>Register new members and view membership status only.</p></button>
      <button class="access-card member" data-login="member"><div class="access-icon">♙</div><h2>Member Login</h2><p>Securely view only your own D12 membership details and status.</p></button>
    </div>
    <div id="loginPanel" class="login-panel hidden"></div>
  </div>
</section>
<div id="app" class="hidden">
  <div class="shell">
    <aside class="sidebar"><div class="brand">D12 CUE CLUB<small>Membership V2.1</small><span id="roleBadge" class="role-badge"></span></div><nav id="nav" class="nav"></nav></aside>
    <main><header class="topbar"><div><h1 id="pageTitle">Membership</h1><p id="pageSub"></p></div><div id="topActions" class="actions"></div></header><section id="view"></section></main>
    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>
</div>
<div id="memberModal" class="modal hidden"><div class="card modal-card"><div class="modal-head"><h2>Register Member</h2><button class="icon-btn" data-close="memberModal">×</button></div><form id="memberForm"><div class="row"><div class="field"><label>FULL NAME *</label><input name="full_name" required></div><div class="field"><label>PHONE</label><input name="phone"></div><div class="field"><label>EMAIL</label><input name="email" type="email"></div><div class="field"><label>GENDER</label><select name="gender"><option value=""></option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>ADDRESS</label><input name="address"></div><div class="field"><label>EMERGENCY CONTACT</label><input name="emergency_contact"></div></div><div class="field" style="margin-top:10px"><label>NOTES</label><textarea name="notes"></textarea></div><div class="notice" style="margin-top:12px">A private 4-digit Member PIN is generated automatically and shown once after registration.</div><button class="btn primary" style="margin-top:12px">Save & Create Membership Card</button></form></div></div>
<div id="cardModal" class="modal hidden"><div class="card modal-card"><div class="modal-head"><h2>Membership Card</h2><button class="icon-btn" data-close="cardModal">×</button></div><div id="cardMount"></div></div></div>
<div id="toast" class="toast"></div>
</body>
</html>
