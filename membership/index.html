<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f5f5f7" />
<title>D12 Cue Club Membership</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#111318;--muted:#737782;--line:#e7e8ec;--blue:#0a84ff;--green:#198754;--amber:#b87400;--red:#d23b3b;--shadow:0 14px 40px rgba(0,0,0,.08)}
html.dark{--bg:#0b0d11;--card:#1a1d23;--text:#f7f7f9;--muted:#a7abb5;--line:#30343d;--blue:#65a8ff;--shadow:0 14px 42px rgba(0,0,0,.34)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,rgba(10,132,255,.1),transparent 28%),var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.logo{width:72px;height:72px;border-radius:22px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.login h1{font-size:34px;letter-spacing:-.04em;margin:18px 0 6px}.muted{color:var(--muted)}.field{display:grid;gap:7px;min-width:160px;flex:1}.field label{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:.03em}.field input,.field select,.field textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);padding:11px 13px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.13)}.btn{min-height:48px;border:0;border-radius:15px;padding:11px 15px;font-weight:850;background:#eceef2;color:#111}.dark .btn{background:#2a2e36;color:#fff}.btn.primary{background:var(--blue);color:#fff}.btn.good{background:var(--green);color:#fff}.btn.danger{color:var(--red)}.shell{max-width:1500px;margin:auto;display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{padding:24px 16px;border-right:1px solid var(--line)}.brand{font-weight:950;font-size:19px;line-height:1.12;margin:6px 8px 28px}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:var(--muted);padding:14px 15px;border-radius:15px;text-align:left;font-weight:800}.nav button.active,.nav button:hover{background:var(--card);color:var(--text);box-shadow:var(--shadow)}main{padding:28px 32px 100px;min-width:0}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.topbar h1{margin:0;font-size:clamp(28px,3.2vw,44px);letter-spacing:-.05em}.topbar p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.kpi{padding:18px}.kpi span{font-size:11px;color:var(--muted);font-weight:850}.kpi b{display:block;font-size:30px;margin-top:5px;letter-spacing:-.03em}.section{padding:18px;margin-bottom:14px}.section h2{margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}.table-wrap table{width:100%;border-collapse:collapse;min-width:780px}.table-wrap th,.table-wrap td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}.table-wrap th{font-size:11px;color:var(--muted);text-transform:uppercase}.table-wrap tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.pill.active{background:rgba(25,135,84,.14);color:var(--green)}.pill.soon{background:rgba(184,116,0,.15);color:var(--amber)}.pill.expired{background:rgba(210,59,59,.14);color:var(--red)}.pill.inactive{background:rgba(128,128,128,.13);color:var(--muted)}.notice{padding:13px 14px;border-radius:16px;background:rgba(10,132,255,.08);color:var(--muted);line-height:1.5}.plans{grid-template-columns:repeat(4,1fr)}.plan{padding:16px}.plan h3{margin:0 0 6px}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#111;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);max-width:min(360px,calc(100vw - 36px));opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.mobile-nav{display:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:20px;z-index:40}.modal-card{width:min(720px,100%);max-height:88vh;overflow:auto;padding:20px}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.modal-head h2{margin:0}.icon-btn{width:44px;height:44px;border:0;border-radius:13px;background:#eceef2;font-weight:900}.dark .icon-btn{background:#2a2e36;color:#fff}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}main{padding:20px 14px 95px}.kpis{grid-template-columns:1fr 1fr}.plans{grid-template-columns:1fr 1fr}.mobile-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 2px}.mobile-nav button.active{color:var(--blue)}}
@media(max-width:620px){.topbar{align-items:flex-start}.actions .wide{display:none}.kpis{gap:9px}.kpi{padding:14px}.kpi b{font-size:24px}.plans{grid-template-columns:1fr}.field{min-width:100%}.section{padding:14px;border-radius:20px}.login-card{padding:22px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">D12</div>
    <h1>Membership Manager</h1>
    <p class="muted">Private D12 Cue Club administrator access.</p>
    <form id="loginForm">
      <div class="field"><label>ADMIN ACCESS CODE</label><input id="passcode" type="password" required autofocus autocomplete="current-password"></div>
      <button class="btn primary" style="width:100%;margin-top:12px">Unlock App</button>
    </form>
    <div id="loginError" style="color:var(--red);margin-top:10px"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">D12 CUE CLUB<small>Membership V1</small></div>
      <nav id="nav" class="nav"></nav>
    </aside>
    <main>
      <header class="topbar">
        <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Membership health at a glance.</p></div>
        <div class="actions"><button class="btn" id="themeBtn">◐ Theme</button><button class="btn wide" onclick="openMemberModal()">＋ Member</button><button class="btn primary wide" onclick="go('payments')">＋ Payment</button></div>
      </header>
      <section id="view"></section>
    </main>
    <nav id="mobileNav" class="mobile-nav"></nav>
  </div>
</div>

<div id="memberModal" class="modal hidden">
  <div class="card modal-card">
    <div class="modal-head"><h2>Register Member</h2><button class="icon-btn" onclick="closeMemberModal()">×</button></div>
    <form id="memberForm">
      <div class="row">
        <div class="field"><label>FULL NAME *</label><input name="full_name" required></div>
        <div class="field"><label>PHONE</label><input name="phone"></div>
        <div class="field"><label>EMAIL</label><input name="email" type="email"></div>
        <div class="field"><label>GENDER</label><select name="gender"><option value=""></option><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div class="field"><label>ADDRESS</label><input name="address"></div>
        <div class="field"><label>EMERGENCY CONTACT</label><input name="emergency_contact"></div>
      </div>
      <div class="field" style="margin-top:10px"><label>NOTES</label><textarea name="notes"></textarea></div>
      <button class="btn primary" style="margin-top:12px">Save Member</button>
    </form>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const API='https://ydveditxorbtqufwnzpt.supabase.co/functions/v1/d12-membership';
const navItems=[['dashboard','⌂','Dashboard'],['members','♙','Members'],['payments','₦','Payments'],['renewals','↻','Renewals'],['settings','⚙','Settings']];
let token=localStorage.getItem('d12m_token')||'', page='dashboard', data=null;
const $=s=>document.querySelector(s), money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:0}), today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
function status(expiry){const w=Number(data?.settings?.expiring_soon_days||7);if(!expiry)return{label:'INACTIVE',days:null,cls:'inactive'};const t=new Date();t.setHours(0,0,0,0);const e=new Date(expiry+'T00:00:00');const days=Math.floor((e-t)/86400000)+1;if(days<=0)return{label:'EXPIRED',days:0,cls:'expired'};if(days<=w)return{label:'EXPIRING SOON',days,cls:'soon'};return{label:'ACTIVE',days,cls:'active'}}
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({ok:false,error:'Invalid server response.'}));if(r.status===401&&action!=='login'){logoutLocal();throw new Error(j.error||'Session expired.')}if(!r.ok||!j.ok)throw new Error(j.error||'Request failed.');return j}
async function bootstrap(){const j=await api('bootstrap');data=j;render()}
function logoutLocal(){token='';localStorage.removeItem('d12m_token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const j=await api('login',{passcode:$('#passcode').value});token=j.token;localStorage.setItem('d12m_token',token);$('#passcode').value='';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await bootstrap()}catch(err){$('#loginError').textContent=err.message}})
function go(p){page=p;render()}
function setNav(){const html=navItems.map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i} &nbsp;${l}</button>`).join('');$('#nav').innerHTML=html;$('#mobileNav').innerHTML=navItems.map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i}<br>${l}</button>`).join('')}
function pill(s){return `<span class="pill ${s.cls}">${s.label}</span>`}
function memberRows(rows,actions=false){if(!rows.length)return `<div class="empty">No members found.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Member</th><th>Phone</th><th>Plan</th><th>Expiry</th><th>Days</th><th>Status</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(m=>{const s=status(m.expiry_date);let phone=(m.phone||'').replace(/\D/g,'').replace(/^0/,'234');return `<tr><td><b>${esc(m.full_name)}</b><br><small>${esc(m.member_code)}</small></td><td>${esc(m.phone||'—')}</td><td>${esc(m.current_plan_name||'—')}</td><td>${esc(m.expiry_date||'—')}</td><td>${s.days??'—'}</td><td>${pill(s)}</td>${actions?`<td>${phone?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${phone}">WhatsApp</a> `:''}<button class="btn danger" onclick="archiveMember('${m.id}')">Archive</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const ms=data.members||[],ps=data.payments||[];const active=ms.filter(m=>['ACTIVE','EXPIRING SOON'].includes(status(m.expiry_date).label)).length,soon=ms.filter(m=>status(m.expiry_date).label==='EXPIRING SOON').length,expired=ms.filter(m=>status(m.expiry_date).label==='EXPIRED').length,revenue=ps.filter(p=>p.payment_status==='Paid').reduce((a,p)=>a+Number(p.amount),0),watch=ms.filter(m=>['EXPIRING SOON','EXPIRED'].includes(status(m.expiry_date).label)).slice(0,10);return `<div class="grid kpis"><div class="card kpi"><span>ACTIVE MEMBERS</span><b>${active}</b></div><div class="card kpi"><span>EXPIRING SOON</span><b>${soon}</b></div><div class="card kpi"><span>EXPIRED</span><b>${expired}</b></div><div class="card kpi"><span>VERIFIED REVENUE</span><b>${money(revenue)}</b></div></div><div class="card section"><h2>Renewal Watch</h2>${memberRows(watch)}</div><div class="card section"><div class="notice">Membership is personal and non-transferable. Tournaments, special events and applicable VIP/challenge charges are separate. Expired members return to the ${money(data.settings.daily_rate)} daily rate until renewal.</div></div>`}
function members(){return `<div class="card section"><div class="row"><button class="btn primary" onclick="openMemberModal()">＋ Register Member</button><label class="btn" style="display:inline-flex;align-items:center">Import CSV<input id="csvFile" type="file" accept=".csv,text/csv" hidden onchange="importCSV(this.files[0])"></label><button class="btn" onclick="exportCSV()">Export CSV</button></div><h2 style="margin-top:18px">Members Sheet</h2>${memberRows(data.members||[],true)}</div>`}
function payments(){const plans=(data.plans||[]).filter(p=>p.active&&p.price),ms=data.members||[],ps=data.payments||[];return `<div class="card section"><h2>Record Payment</h2><form id="paymentForm"><div class="row"><div class="field"><label>MEMBER *</label><select name="member_id" required><option value="">Select member</option>${ms.map(m=>`<option value="${m.id}">${esc(m.full_name)} — ${esc(m.member_code)}</option>`).join('')}</select></div><div class="field"><label>PLAN *</label><select name="plan_id" required><option value="">Select plan</option>${plans.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('')}</select></div><div class="field"><label>AMOUNT PAID *</label><input name="amount" type="number" min="1" required></div><div class="field"><label>PAYMENT DATE</label><input name="payment_date" type="date" value="${today()}"></div><div class="field"><label>METHOD</label><select name="payment_method"><option>Transfer</option><option>Cash</option><option>POS</option><option>Other</option></select></div><div class="field"><label>REFERENCE</label><input name="reference"></div></div><div class="notice" style="margin-top:12px">Recording payment does not activate membership. Verify funds first, then set the Activation Date.</div><button class="btn primary" style="margin-top:12px">Record as Pending</button></form></div><div class="card section"><h2>Payment Register</h2><div class="table-wrap"><table><thead><tr><th>Member</th><th>Plan</th><th>Amount</th><th>Status</th><th>Date</th><th>Activation</th><th>Action</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.d12_membership_members?.full_name||'Unknown')}</td><td>${esc(p.d12_membership_plans?.name||'Plan')}</td><td><b>${money(p.amount)}</b></td><td>${esc(p.payment_status)}</td><td>${esc(p.payment_date)}</td><td>${esc(p.activation_date||'—')}</td><td>${p.payment_status==='Pending'?`<input id="act-${p.id}" type="date" value="${today()}" style="min-width:145px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:8px"> <button class="btn good" onclick="verifyPayment('${p.id}')">Verify</button> <button class="btn danger" onclick="rejectPayment('${p.id}')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>`}
function renewals(){const rows=(data.members||[]).filter(m=>['EXPIRING SOON','EXPIRED'].includes(status(m.expiry_date).label)).sort((a,b)=>(status(a.expiry_date).days||0)-(status(b.expiry_date).days||0));return `<div class="card section"><h2>Renewal Queue</h2>${memberRows(rows)}</div>`}
function settings(){return `<div class="card section"><h2>Club Rates & Alerts</h2><form id="settingsForm"><div class="row"><div class="field"><label>DAILY RATE AFTER EXPIRY (₦)</label><input name="daily_rate" type="number" min="0" value="${data.settings.daily_rate}" required></div><div class="field"><label>EXPIRING SOON WINDOW (DAYS)</label><input name="expiring_soon_days" type="number" min="1" max="60" value="${data.settings.expiring_soon_days}" required></div></div><button class="btn primary" style="margin-top:12px">Save Club Settings</button></form></div><div class="card section"><h2>Membership Plans</h2><div class="grid plans">${(data.plans||[]).map(p=>`<form class="card plan planForm" data-id="${p.id}"><h3>${esc(p.name)}</h3><div class="muted">${p.period_value} ${esc(p.period_unit)}</div><div class="field" style="margin-top:10px"><label>PRICE (₦)</label><input name="price" type="number" min="1" value="${p.price||''}" placeholder="Set price"></div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input name="active" type="checkbox" style="width:auto" ${p.active?'checked':''}> Active plan</label><button class="btn" style="width:100%;margin-top:10px">Save Plan</button></form>`).join('')}</div></div><div class="card section"><div class="notice">Membership is personal and non-transferable. Payment Status becomes Paid only after verification. Expired members return to the daily rate until renewal. Tournaments, special events and applicable VIP/challenge charges are separate.</div><button class="btn danger" style="margin-top:12px" onclick="logout()">Lock / Sign Out</button></div>`}
function render(){if(!data)return;setNav();const titles={dashboard:['Dashboard','Membership health at a glance.'],members:['Members','Register, import and manage members.'],payments:['Payments','Payment remains Pending until you verify it.'],renewals:['Renewals','Follow up members who need attention.'],settings:['Settings','Admin-only rates, plan pricing and policies.']};$('#pageTitle').textContent=titles[page][0];$('#pageSub').textContent=titles[page][1];$('#view').innerHTML=({dashboard,members,payments,renewals,settings}[page])();bindForms()}
function bindForms(){const pf=$('#paymentForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(pf));try{await api('record_payment',f);toast('Payment recorded as Pending.');await bootstrap()}catch(err){toast(err.message)}};const sf=$('#settingsForm');if(sf)sf.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(sf));f.expiring_soon_days=Number(f.expiring_soon_days);f.daily_rate=Number(f.daily_rate);try{await api('save_settings',f);toast('Settings saved.');await bootstrap()}catch(err){toast(err.message)}};document.querySelectorAll('.planForm').forEach(form=>form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form);try{await api('save_plan',{id:form.dataset.id,price:Number(fd.get('price')||0),active:fd.get('active')==='on'});toast('Plan saved.');await bootstrap()}catch(err){toast(err.message)}})}
function openMemberModal(){$('#memberModal').classList.remove('hidden')}function closeMemberModal(){$('#memberModal').classList.add('hidden')}
$('#memberForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{await api('add_member',f);e.target.reset();closeMemberModal();toast('Member registered.');await bootstrap();page='members';render()}catch(err){toast(err.message)}})
async function archiveMember(id){if(!confirm('Archive this member? Payment history will be kept.'))return;try{await api('archive_member',{id});toast('Member archived.');await bootstrap()}catch(err){toast(err.message)}}
async function verifyPayment(id){const activation=$('#act-'+id).value;try{const j=await api('verify_payment',{id,activation_date:activation});toast('Payment verified. Expires '+j.expiry_date);await bootstrap()}catch(err){toast(err.message)}}
async function rejectPayment(id){if(!confirm('Reject this pending payment?'))return;try{await api('reject_payment',{id});toast('Payment rejected.');await bootstrap()}catch(err){toast(err.message)}}
async function logout(){try{await api('logout')}catch(e){}logoutLocal()}
function exportCSV(){const rows=[['Member Code','Full Name','Phone','Email','Activation Date','Expiry Date','Days Remaining','Membership Status','Current Plan'],...(data.members||[]).map(m=>{const s=status(m.expiry_date);return[m.member_code,m.full_name,m.phone,m.email,m.activation_date,m.expiry_date,s.days,s.label,m.current_plan_name]})];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='D12_Members.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)return[];const split=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};const head=split(lines.shift()).map(x=>x.trim().toLowerCase().replace(/\s+/g,'_'));return lines.map(line=>{const vals=split(line),o={};head.forEach((h,i)=>o[h]=vals[i]||'');return o})}
async function importCSV(file){if(!file)return;try{const rows=parseCSV(await file.text());const j=await api('import_members',{rows});toast(j.count+' members imported.');await bootstrap()}catch(err){toast(err.message)}}
$('#themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.d12theme=document.documentElement.classList.contains('dark')?'dark':'light'};if(localStorage.d12theme==='dark')document.documentElement.classList.add('dark');
(async()=>{if(token){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');try{await bootstrap()}catch(e){logoutLocal()}}})();
</script>
</body>
</html>
