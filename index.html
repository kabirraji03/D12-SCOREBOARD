      const games=Object.values(S.games||{});const local=games.find(g=>g?.cloudMatchId===row.id);
      if(local){local.cloudMatchId='';if(row.status==='completed')local.matchEnded=true;d12CloudStatus(row.status==='completed'?'ok':'idle',row.status==='completed'?'Match completed on another screen':'Cloud match closed on another screen');
        if(row.status==='completed'&&local.p1&&local.p2){try{local._cloudAggregate=await d12FetchCloudAggregate(local,true)}catch(err){console.warn('D12 realtime aggregate refresh:',err)}}
        save();d12RealtimeScheduleRender(30);
      }
      await d12RealtimeReconcile(D12_RT.generation,'event');
    }
  }else if(payload.eventType==='DELETE'){
    await d12RealtimeReconcile(D12_RT.generation,'event');
  }
}
function d12RealtimeAttachChannel(tableId,generation){
  const channelName='d12-live-sync-'+String(D12_AUTH.user?.id||'anon').replace(/[^a-zA-Z0-9_-]/g,'')+'-'+String(tableId).replace(/[^a-zA-Z0-9_-]/g,'')+'-'+generation;
  const channel=d12Supabase.channel(channelName);
  channel
    .on('postgres_changes',{event:'*',schema:'public',table:'matches'},payload=>{void d12RealtimeHandleMatchPayload(payload)})
    .on('postgres_changes',{event:'*',schema:'public',table:'table_assignments'},async payload=>{
      if(D12_RT.generation!==generation)return;
      try{
        const row=payload?.new||payload?.old||{};
        if(d12IsOperator()&&(String(row.operator_id||'')===String(D12_AUTH.user.id)||String(row.operator_id||'')===String(D12_AUTH.user.id))){
          await d12LoadAssignment(D12_AUTH.user.id);D12_AUTH.selectedTableId=D12_AUTH.assignment?.table_id||null;d12SetWorkspaceBar();render();
          if(D12_AUTH.selectedTableId!==tableId)void d12StartRealtime(D12_AUTH.selectedTableId);
          else void d12RealtimeReconcile(generation,'event');
        }else if(d12IsOperator()){
          await d12LoadAssignment(D12_AUTH.user.id);const assigned=D12_AUTH.assignment?.table_id||null;
          if(String(assigned||'')!==String(D12_AUTH.selectedTableId||'')){D12_AUTH.selectedTableId=assigned||null;d12SetWorkspaceBar();render();void d12StartRealtime(assigned)}
        }else if(d12IsAdmin()){
          await d12LoadAdminDashboard();d12RealtimeScheduleRender(50);
        }
      }catch(err){console.warn('D12 realtime assignment sync:',err)}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'cue_tables'},async()=>{
      if(D12_RT.generation!==generation)return;
      if(d12IsAdmin()){try{await d12LoadAdminDashboard();d12RealtimeScheduleRender(50)}catch(err){console.warn('D12 realtime table sync:',err)}}
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'players'},async()=>{
      if(D12_RT.generation!==generation)return;
      try{await d12GetPlayers(true);d12RealtimeScheduleRender(50)}catch(err){console.warn('D12 realtime player sync:',err)}
    });
  channel.subscribe((status,err)=>{
    if(D12_RT.channel!==channel||D12_RT.generation!==generation)return;
    if(status==='SUBSCRIBED'){d12RealtimeState('ok');d12SetWorkspaceBar();void d12RealtimeReconcile(generation,'subscribe')}
    else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      console.warn('D12 realtime channel status:',status,err||'');d12RealtimeState('bad');d12SetWorkspaceBar();
      if(D12_RT_RETRY_TIMER)clearTimeout(D12_RT_RETRY_TIMER);
      D12_RT_RETRY_TIMER=setTimeout(()=>{D12_RT_RETRY_TIMER=null;if(D12_AUTH.user&&D12_RT.tableId===tableId)void d12StartRealtime(tableId)},2500);
    }else if(status==='SUBSCRIBING'){d12RealtimeState('warn');d12SetWorkspaceBar()}
  });
  return channel;
}
async function d12StartRealtime(tableId){
  if(!d12Supabase||!D12_AUTH.user||!tableId){d12RealtimeStop();return}
  const normalized=String(tableId);
  if(D12_RT.channel&&String(D12_RT.tableId)===normalized)return;
  d12RealtimeStop();
  const generation=D12_RT.generation;
  D12_RT.tableId=normalized;D12_RT_LAST_SIGNATURE='';d12RealtimeState('warn');d12SetWorkspaceBar();
  const channel=d12RealtimeAttachChannel(normalized,generation);
  D12_RT.channel=channel;
  void d12RealtimeReconcile(generation,'initial');
}

async function d12AddCloudPlayer(){if(!d12IsAdmin())return alert('Administrator access required.');const input=document.getElementById('d12CloudPlayerName');const name=String(input?.value||'').trim().replace(/\s+/g,' ');if(!name||name.length>60)return alert('Enter a player name (maximum 60 characters).');try{const players=await d12GetPlayers(true);if(players.some(p=>String(p.full_name||'').trim().toLowerCase()===name.toLowerCase()))return alert('That player is already registered in the D12 cloud player list.');const {data,error}=await d12Supabase.from('players').insert({full_name:name,created_by:D12_AUTH.user.id}).select('id,full_name').single();if(error)throw error;D12_PLAYER_CACHE=[...players,data].sort((a,b)=>String(a.full_name).localeCompare(String(b.full_name)));S.players=D12_PLAYER_CACHE.map(p=>p.full_name);save();if(input)input.value='';d12CloudStatus('ok','Player registered in D12 cloud');render();}catch(err){console.error('D12 add cloud player error:',err);alert('Player could not be registered. '+(err?.message||'Unknown error'));}}

async function d12LoadActiveCloudMatch(tableId){if(!tableId||!D12_AUTH.user)return null;try{const {data,error}=await d12Supabase.from('matches').select('id,discipline,table_id,operator_id,player1_id,player2_id,player1_score,player2_score,active_player,status,shot_clock_enabled,shot_time_seconds,extensions_remaining,started_at').eq('table_id',tableId).eq('status','active').maybeSingle();if(error)throw error;if(!data){d12CloudStatus('idle','No active cloud match on this table');return null;}const ids=[data.player1_id,data.player2_id].filter(Boolean);let players=[];if(ids.length){const r=await d12Supabase.from('players').select('id,full_name').in('id',ids);if(r.error)throw r.error;players=r.data||[];}const names=new Map(players.map(x=>[x.id,x.full_name]));const tab=d12DisciplineKey(data.discipline);if(!tab)return data;S.games[tab]={...(S.games[tab]||{}),p1:names.get(data.player1_id)||'Player 1',p2:names.get(data.player2_id)||'Player 2',s1:Number(data.player1_score)||0,s2:Number(data.player2_score)||0,active:Number(data.active_player)||1,t:Number(data.shot_time_seconds)||S.set.shot,e:Number(data.extensions_remaining)||0,matchEnded:false,lastWinner:'',cloudMatchId:data.id};d12CloudStatus('ok','Active cloud match: '+tab);void d12RefreshCloudAggregate(S.games[tab],true);return data;}catch(err){console.error('D12 load active match error:',err);d12CloudStatus('bad','Cloud match could not be loaded');return null;}}
async function d12RestoreActiveCloudMatch(tableId){const m=await d12LoadActiveCloudMatch(tableId);if(m){const tab=d12DisciplineKey(m.discipline);if(tab)cur=tab;}return m;}
async function d12EnsureCloudMatch(d){
  if(!D12_AUTH.user)throw new Error('You must be signed in.');
  const tableId=d12CurrentTableId();
  if(!tableId)throw new Error('No cue table is assigned to this account.');
  const discipline=({'8-Ball':'8-ball','9-Ball':'9-ball','10-Ball':'10-ball','Heyball':'heyball','Blackball':'blackball','Duya Legends':'duya-legends','Snooker':'snooker'})[cur];
  if(!discipline)throw new Error('This screen is not a scoring discipline.');

  // A local cloudMatchId may point to an old completed/cancelled match. Always
  // verify its current database status before using it.
  if(d.cloudMatchId){
    const existing=await d12Supabase.from('matches').select('id,status,discipline,player1_id,player2_id,player1_score,player2_score,active_player').eq('id',d.cloudMatchId).maybeSingle();
    if(existing.error)throw existing.error;
    if(existing.data?.status==='active'){
      return existing.data.id;
    }
    d.cloudMatchId='';
  }

  const {data:active,error:activeErr}=await d12Supabase.from('matches').select('id,discipline,player1_id,player2_id,player1_score,player2_score,active_player,status').eq('table_id',tableId).eq('status','active').maybeSingle();
  if(activeErr)throw activeErr;

  const p1Id=await d12ResolvePlayerId(d.p1),p2Id=await d12ResolvePlayerId(d.p2);
  if(p1Id===p2Id)throw new Error('Player 1 and Player 2 must be different players.');

  if(active){
    if(active.discipline!==discipline)throw new Error('Table '+d12CurrentTableName()+' already has an active '+active.discipline+' match. End or reset that match before starting '+discipline+'.');
    if(active.player1_id!==p1Id||active.player2_id!==p2Id)throw new Error('The table already has an active '+active.discipline+' match with different players. End or reset that match before changing the players.');
    d.cloudMatchId=active.id;
    d.s1=Number(active.player1_score)||0;
    d.s2=Number(active.player2_score)||0;
    d.active=Number(active.active_player)||1;
    d.matchEnded=false;
    d12CloudStatus('ok','Connected to existing cloud match');
    return active.id;
  }

  const payload={table_id:tableId,operator_id:D12_AUTH.user.id,discipline,player1_id:p1Id,player2_id:p2Id,player1_score:Number(d.s1)||0,player2_score:Number(d.s2)||0,active_player:Number(d.active)||1,status:'active',shot_clock_enabled:!!S.set.independentClock,shot_time_seconds:Number(S.set.shot)||45,extensions_remaining:Number(d.e)||0};
  const {data,error}=await d12Supabase.from('matches').insert(payload).select('id,discipline,status').single();
  if(error)throw error;
  if(!data?.id)throw new Error('Cloud match was created without an id.');
  d.cloudMatchId=data.id;
  d12CloudStatus('ok','Cloud match created');
  return data.id;
}
async function d12RecordCloudEvent(matchId,playerId,points,eventType,metadata={}){if(!matchId||!playerId)return;const {error}=await d12Supabase.from('match_events').insert({match_id:matchId,event_type:eventType||'score',player_id:playerId,points:Number(points)||0,created_by:D12_AUTH.user.id,metadata});if(error)console.warn('D12 match event warning:',error);}
async function d12PersistScore(d,player,delta,eventType,metadata={}){
  let matchId=await d12EnsureCloudMatch(d);
  const p1Id=await d12ResolvePlayerId(d.p1),p2Id=await d12ResolvePlayerId(d.p2);
  const patch={player1_score:Math.max(0,Number(d.s1)||0),player2_score:Math.max(0,Number(d.s2)||0),active_player:Number(d.active)||1};

  for(let attempt=0;attempt<2;attempt++){
    const {data,error}=await d12Supabase.from('matches').update(patch).eq('id',matchId).eq('status','active').select('id,status').maybeSingle();
    if(error)throw error;
    if(data?.id){
      await d12RecordCloudEvent(matchId,player===1?p1Id:p2Id,delta,eventType,metadata);
      d12CloudStatus('ok','Score saved to cloud');
      return;
    }

    // The local id can become stale after End Match/Reset, another operator,
    // or a refresh. Clear it, re-discover the current active match, and retry once.
    d.cloudMatchId='';
    if(attempt===0){
      matchId=await d12EnsureCloudMatch(d);
      continue;
    }
  }
  throw new Error('The cloud match is no longer active. The app could not reconnect to an active match. Press New Match and try again.');
}
async function d12PersistActivePlayer(d){if(!d.cloudMatchId)return;const {error}=await d12Supabase.from('matches').update({active_player:Number(d.active)||1}).eq('id',d.cloudMatchId).eq('status','active');if(error)console.warn('D12 active player sync warning:',error);}
let D12_AGG_CACHE={};
let D12_AGG_FETCH_KEY='';

function d12AggregateCacheKey(p1Id,p2Id){return [String(p1Id||''),String(p2Id||'')].sort().join('||')}

async function d12FetchCloudAggregate(d,force=false){
  const p1Id=await d12ResolvePlayerId(d.p1),p2Id=await d12ResolvePlayerId(d.p2);
  if(p1Id===p2Id)throw new Error('Player 1 and Player 2 must be different players.');
  const key=d12AggregateCacheKey(p1Id,p2Id);
  if(!force&&D12_AGG_CACHE[key])return D12_AGG_CACHE[key];
  let {data,error}=await d12Supabase.from('head_to_head').select('player_a_id,player_b_id,player_a_wins,player_b_wins').eq('player_a_id',p1Id).eq('player_b_id',p2Id).maybeSingle();
  if(error)throw error;
  if(!data){
    const r=await d12Supabase.from('head_to_head').select('player_a_id,player_b_id,player_a_wins,player_b_wins').eq('player_a_id',p2Id).eq('player_b_id',p1Id).maybeSingle();
    if(r.error)throw r.error;
    data=r.data||null;
  }
  const result=data
    ? (data.player_a_id===p1Id
        ? {player1Wins:Number(data.player_a_wins)||0,player2Wins:Number(data.player_b_wins)||0}
        : {player1Wins:Number(data.player_b_wins)||0,player2Wins:Number(data.player_a_wins)||0})
    : {player1Wins:0,player2Wins:0};
  D12_AGG_CACHE[key]=result;
  return result;
}

async function d12RefreshCloudAggregate(d,force=false){
  try{
    if(!D12_AUTH.user||!d?.p1||!d?.p2)return;
    const p1Id=await d12ResolvePlayerId(d.p1),p2Id=await d12ResolvePlayerId(d.p2);
    if(p1Id===p2Id)return;
    const key=d12AggregateCacheKey(p1Id,p2Id);
    if(!force&&D12_AGG_FETCH_KEY===key&&D12_AGG_CACHE[key])return;
    D12_AGG_FETCH_KEY=key;
    const agg=await d12FetchCloudAggregate(d,force);
    d._cloudAggregate=agg;
    if(S.games[cur]===d)render();
  }catch(err){
    console.warn('D12 cloud aggregate load warning:',err);
  }
}

async function d12CompleteCloudMatch(d,winnerNumber){
  if(!D12_AUTH.user)throw new Error('You must be signed in.');
  const tableId=d12CurrentTableId();
  if(!tableId)throw new Error('No cue table is assigned to this account.');
  const p1Id=await d12ResolvePlayerId(d.p1),p2Id=await d12ResolvePlayerId(d.p2);
  const winnerId=winnerNumber===1?p1Id:p2Id;
  let matchId=String(d.cloudMatchId||'');

  if(matchId){
    const current=await d12Supabase.from('matches').select('id,status,table_id,player1_id,player2_id,discipline,player1_score,player2_score').eq('id',matchId).maybeSingle();
    if(current.error)throw current.error;
    if(!current.data||current.data.table_id!==tableId||current.data.status!=='active')matchId='';
    else if(current.data.player1_id!==p1Id||current.data.player2_id!==p2Id)matchId='';
  }

  if(!matchId){
    const active=await d12Supabase.from('matches').select('id,status,table_id,player1_id,player2_id,discipline,player1_score,player2_score').eq('table_id',tableId).eq('status','active').maybeSingle();
    if(active.error)throw active.error;
    if(!active.data)throw new Error('There is no active cloud match for this table. Start a New Match first.');
    if(active.data.player1_id!==p1Id||active.data.player2_id!==p2Id)throw new Error('The active cloud match has different players. Reload the table before ending the match.');
    matchId=active.data.id;
  }

  const {data,error}=await d12Supabase.rpc('complete_match_and_update_head_to_head',{p_match_id:matchId,p_winner_id:winnerId});
  if(error)throw error;
  const result=Array.isArray(data)?data[0]:data;
  if(!result?.match_id)throw new Error('The secure End Match function did not return a completed match record.');

  const key=d12AggregateCacheKey(p1Id,p2Id);
  D12_AGG_CACHE[key]={player1Wins:Number(result.player1_wins)||0,player2Wins:Number(result.player2_wins)||0};
  d._cloudAggregate=D12_AGG_CACHE[key];
  D12_AGG_FETCH_KEY=key;
  d12CloudStatus('ok',result.already_completed?'Match was already completed in cloud':'Match completed and aggregate updated securely');
  return matchId;
}
async function d12CancelCloudMatch(d){
  const tableId=d12CurrentTableId();
  if(!tableId){ if(d)d.cloudMatchId=''; return true; }

  // Never trust the browser's local match id as the only source of truth.
  // First resolve the active match for the current table. This handles stale
  // local ids, browser refreshes, player changes, and matches created by the
  // same operator on another screen.
  let matchId=d?.cloudMatchId||'';
  let check=null;

  if(matchId){
    check=await d12Supabase.from('matches').select('id,status,table_id').eq('id',matchId).maybeSingle();
    if(check.error)throw check.error;
    if(!check.data || check.data.table_id!==tableId){matchId='';check=null;}
  }

  if(!matchId){
    const active=await d12Supabase.from('matches').select('id,status,table_id').eq('table_id',tableId).eq('status','active').maybeSingle();
    if(active.error)throw active.error;
    if(!active.data){if(d)d.cloudMatchId='';d12CloudStatus('idle','No active cloud match to reset');return true;}
    matchId=active.data.id;
    check=active;
  }

  if(check?.data?.status!=='active'){
    if(d)d.cloudMatchId='';
    d12CloudStatus('idle','Previous cloud match was already '+String(check?.data?.status||'closed'));
    return true;
  }

  const {error}=await d12Supabase.from('matches')
    .update({status:'cancelled',ended_at:new Date().toISOString()})
    .eq('id',matchId)
    .eq('table_id',tableId)
    .eq('status','active');
  if(error)throw error;

  const verify=await d12Supabase.from('matches').select('id,status').eq('id',matchId).maybeSingle();

let D12_FIT_TIMER=0;
let D12_FIT_BUSY=false;
function d12FitViewport(){
  if(D12_FIT_BUSY)return;
  const app=document.getElementById('app');
  if(!app)return;
  clearTimeout(D12_FIT_TIMER);
  D12_FIT_TIMER=setTimeout(()=>{
    if(D12_FIT_BUSY)return;
    D12_FIT_BUSY=true;
    try{
      document.body.classList.remove('d12-fit-active');
      app.style.transform='none';
      app.style.zoom='';
      app.style.height='';
      // The login and device selector already fit naturally; scaling is reserved for the working interface.
      if(!D12_AUTH?.user || !D12_DEVICE_SELECTED_SESSION){document.body.classList.remove('d12-fit-active');app.style.transform='none';app.style.zoom='';app.style.height='';return;}
      const rect=app.getBoundingClientRect();
      const availableH=Math.max(1,window.innerHeight-rect.top-2);
      const availableW=Math.max(1,window.innerWidth-4);
      const naturalH=Math.max(app.scrollHeight,app.offsetHeight,1);
      const naturalW=Math.max(app.scrollWidth,app.offsetWidth,1);
      let scale=Math.min(1,availableH/naturalH,availableW/naturalW);
      if(!Number.isFinite(scale)||scale<=0)scale=1;
      // Small safety margin prevents one-pixel browser rounding from creating a scrollbar.
      if(scale<1)scale=scale*.992;
      app.style.transform=`scale(${scale})`;
      app.style.transformOrigin='top center';
      document.body.classList.add('d12-fit-active');
      app.dataset.fitScale=scale.toFixed(4);
    }finally{D12_FIT_BUSY=false;}
  },20);
}

  const showStatus=(message,type='')=>{
    if(status){
      status.textContent=message;
      status.className='operator-create-status '+type;
    }
  };

  if(!full_name){
    showStatus('Enter the operator full name.','err');
    nameEl?.focus();
    return;
  }
  if(!email){
    showStatus('Enter the operator email address.','err');
    emailEl?.focus();
    return;
  }
  if(!password){
    showStatus('Enter a password for the operator.','err');
    passEl?.focus();
    return;
  }
  if(password.length<6){
    showStatus('Password must contain at least 6 characters.','err');
    passEl?.focus();
    return;
  }
  if(!d12Supabase){
    showStatus('Supabase is not available.','err');
    return;
  }
  if(!d12IsAdmin()){
    showStatus('Only a D12 administrator can create operators.','err');
    return;
  }

  try{
    if(btn){
      btn.disabled=true;
      btn.textContent='Creating Operator…';
    }
    showStatus('Creating secure operator account…');

    const {data,error}=await d12Supabase.functions.invoke('create-d12-operator',{
      body:{full_name,email,password}
    });

    if(error){
      let message=error.message||'Unable to create operator.';
      if(data?.error)message=data.error;
      throw new Error(message);
    }

    if(!data?.success){
      throw new Error(data?.error||'Unable to create operator.');
    }

    if(nameEl)nameEl.value='';
    if(emailEl)emailEl.value='';
    if(passEl)passEl.value='';

    showStatus('Operator created successfully. The operator now appears in the assignment list.','ok');
    await d12LoadAdminDashboard();
  }catch(err){
    console.error('D12 create operator error:',err);
    showStatus(err?.message||'Unable to create operator.','err');
  }finally{
    if(btn){
      btn.disabled=false;
      btn.textContent='＋ Create Operator';
    }
  }
}

async function d12DeleteOperator(operatorId,name){if(!d12IsAdmin()||!operatorId)return;const label=String(name||'this operator');if(!confirm('Delete '+label+'? This removes the D12 operator account and its active table assignment.'))return;try{const {data,error}=await d12Supabase.functions.invoke('delete-d12-operator',{body:{operator_id:operatorId}});if(error)throw error;if(!data?.success)throw new Error(data?.error||'Unable to delete operator.');await d12LoadAdminDashboard();alert('Operator deleted successfully.');}catch(err){console.error('D12 delete operator error:',err);alert('Operator could not be deleted. '+(err?.message||'Unknown error'));}}
function d12TableNumber(table){const m=String(table?.table_name||'').match(/(\d+)\s*$/);return m?Number(m[1]):null;}
function d12NaturalTableSort(a,b){const na=Number((String(a.table_name||'').match(/(\d+)\s*$/)||[])[1]||999999),nb=Number((String(b.table_name||'').match(/(\d+)\s*$/)||[])[1]||999999);return na-nb||String(a.table_name||'').localeCompare(String(b.table_name||''));}
async function d12SetTableCount(value){
  if(!d12IsAdmin())return;
  const desired=Math.max(1,Math.min(64,Math.round(Number(value)||1)));
  const currentCount=D12_ADMIN_CACHE.tables.length;
  if(desired===currentCount)return;
  try{
    const result=await d12Supabase.functions.invoke('manage-d12-tables',{body:{desired_count:desired}});
    let data=result.data;
    const error=result.error;
    if(error){
      let detail=error.message||'Edge Function returned a non-2xx status code';
      try{
        const ctx=error.context;
        if(ctx&&typeof ctx.json==='function'){
          const body=await ctx.json();
          if(body?.error)detail=body.error;
        }
      }catch(_e){}
      throw new Error(detail);
    }
    if(!data?.success)throw new Error(data?.error||'Unable to update table count.');
    await d12LoadAdminDashboard();
    const actual=D12_ADMIN_CACHE.tables.length;
    if(actual!==desired)throw new Error('The database returned '+actual+' tables instead of '+desired+'.');
    alert('Table count updated to '+desired+'.');
  }catch(err){
    console.error('D12 table count error:',err);
    alert('Unable to update table count. '+(err?.message||'Unknown error'));
    await d12LoadAdminDashboard();
  }
}

function snookerTargetHtml(d){if(d.snookerPhase==='reds'){if(d.snookerTarget==='red')return `<div class="snooker-target-red">RED<br>+1</div>`;return `<img class="snooker-any-color-image" src="${D12_SNOOKER_ANY_COLOR_IMAGE}" alt="Any colour" title="Any colour">`;}const z=snookerColorData();if(d.snookerColorIndex>=z.length)return `<div class="snooker-target-red" style="background:radial-gradient(circle at 30% 25%,#fff 0 8%,#666 35%,#222 100%)">FRAME<br>DONE</div>`;const x=z[d.snookerColorIndex];const c=x[2]==='y'?'#d6a400':x[2]==='g'?'#13824a':x[2]==='br'?'#805034':x[2]==='b'?'#1877c9':x[2]==='p'?'#db638f':'#171717';return `<div class="snooker-target-red" style="background:radial-gradient(circle at 30% 25%,#fff 0 8%,${c} 35%,#111 100%)">${x[0]}<br>+${x[1]}</div>`;}
function snookerOrderHtml(d){const z=snookerColorData(),idx=Number(d.snookerColorIndex)||0;return `<div class="snooker-final-order">${z.map((x,i)=>`<div class="snooker-order-ball ${i===idx?'current ':''}${i<idx?'done ':''}${x[2]}">${x[0]}<br>+${x[1]}</div>`).join('')}</div>`;}
function snookerResetSequence(d){d.snookerReds=Math.max(6,Math.min(15,Number(d.snookerReds)||15));d.snookerRedsRemaining=d.snookerReds;d.snookerPhase='reds';d.snookerTarget='red';d.snookerColorIndex=0;d.snookerPointsPotted=0;d.snookerFoulPointsAwarded=0;d.snookerBreak1=0;d.snookerBreak2=0;d.snookerMaxBreak1=0;d.snookerMaxBreak2=0;d.snookerFrameComplete=false;}

function snookerStartVisit(d,p){if(!d)return;p=Number(p)||1;d['snookerBreak'+p]=0;snookerPrepareForIncomingPlayer(d);}
function snookerRecordPot(g,p,value){p=Number(p)||1;value=Math.max(0,Number(value)||0);g.snookerPointsPotted=Math.max(0,Number(g.snookerPointsPotted)||0)+value;const bk='snookerBreak'+p,mk='snookerMaxBreak'+p;g[bk]=Math.max(0,Number(g[bk])||0)+value;g[mk]=Math.max(Math.max(0,Number(g[mk])||0),g[bk]);}

function snookerScore(ballValue){
  const d=S.games['Snooker'];
  if(!d||d.matchEnded||D12_SCORE_BUSY)return;
  const p=Number(document.getElementById('sp')?.value||d.snookerPlayer||d.active||1);
  d.snookerPlayer=p;
  const value=Number(ballValue)||0;
  let eventType='',metadata={},mutation=null;

  if(d.snookerPhase==='reds'){
    if(d.snookerTarget==='red'&&value===1){
      eventType='snooker_red';
      metadata={source:'snooker',ball_value:1,sequence:'red'};
      mutation=(g)=>{
        snookerRecordPot(g,p,1);
        g.snookerRedsRemaining=Math.max(0,(Number(g.snookerRedsRemaining)||0)-1);
        g.snookerTarget='color';
      };
    }else if(d.snookerTarget==='color'&&value>=2&&value<=7){
      eventType='snooker_color';
      metadata={source:'snooker',ball_value:value,sequence:'colour_after_red'};
      mutation=(g)=>{
        snookerRecordPot(g,p,value);
        const remaining=Math.max(0,Number(g.snookerRedsRemaining)||0);
        if(remaining>0){
          g.snookerTarget='red';
        }else{
          g.snookerPhase='colors';
          g.snookerTarget='yellow';
          g.snookerColorIndex=0;
        }
      };
    }else{
      alert('Follow the sequence: RED, then ANY COLOR, then RED, then ANY COLOR.');
      return;
    }
  }else{
    const z=snookerColorData();
    const idx=Number(d.snookerColorIndex)||0;
    if(idx>=z.length){alert('This frame is complete.');return;}
    if(value!==z[idx][1]){alert('Next color is '+z[idx][0]+'.');return;}
    eventType='snooker_final_color';
    metadata={source:'snooker',ball_value:value,color:z[idx][0],sequence:'final_colors'};

    x.strokeStyle=win?'#f2c94c':(b.p===d.active?accent:'#cbd5e1');
    x.lineWidth=win?14:(b.p===d.active?9:3);
    x.shadowColor=win?'rgba(242,201,76,.9)':'transparent';x.shadowBlur=win?34:0;
    drawRoundRect(x,b.x,335,700,440,38);x.fill();x.stroke();x.shadowBlur=0;

    if(win){
      x.fillStyle='#f2c94c';drawRoundRect(x,b.x+38,365,205,48,24);x.fill();
      x.fillStyle='#16120a';x.font='900 24px Arial';x.fillText('🏆 WINNER',b.x+60,398);
    }else if(tie){
      x.fillStyle=accent2;drawRoundRect(x,b.x+38,365,180,48,24);x.fill();
      x.fillStyle='#07101b';x.font='900 22px Arial';x.fillText('MATCH TIED',b.x+55,398);
    }else if(b.p===d.active){
      x.fillStyle=accent;x.font='900 22px Arial';x.fillText('ACTIVE PLAYER',b.x+42,405);
    }

    x.fillStyle=tx;x.font=win?'900 44px Arial':'800 40px Arial';
    let nm=String(b.n||('Player '+b.p)),lag=cur==='Snooker'?snookerLag(b.p,d):0;
    let exportName=nm.slice(0,27)+(lag>0?' (-'+lag+')':'');x.fillText(exportName,b.x+42,490);
    x.fillStyle=win?'#d5a600':accent;x.font='900 240px Arial';
    let sc=String(b.s),m=x.measureText(sc);x.fillText(sc,b.x+350-m.width/2,690);
    if(cur==='Snooker'){
      const maxBreak=Math.max(0,Number(d['snookerMaxBreak'+b.p])||0);
      const rewardText=snookerRewardText(b.p,d);x.fillStyle=mut;x.font='800 25px Arial';x.fillText('Player performance • Maximum break: '+maxBreak+(rewardText?' • '+rewardText:''),b.x+42,735);
    }
  });

  // Aggregate result.
  const agg=aggregateText(d);
  x.fillStyle=dark?'#1b2a3e':'#e8f2ff';drawRoundRect(x,520,825,760,95,28);x.fill();
  x.strokeStyle=accent;x.lineWidth=3;x.stroke();
  x.fillStyle=tx;x.font='900 38px Arial';let am=x.measureText(agg);x.fillText(agg,(W-am.width)/2,887);

  x.fillStyle=mut;x.font='600 24px Arial';
  let note=cur==='Duya Legends'?'Duya: Break & Run 10 • Table Run 7 • Normal Win 4 • Foul 1':cur==='Snooker'?('Snooker: Remaining ball points '+snookerRemainingPoints(d)+' • Fouls excluded • Century = 100+ break • Maximum = 147 break'):'Final match score';
  x.fillText(note,150,975);
  x.fillStyle=accent;x.font='800 22px Arial';x.fillText('Generated by D12 Cue Club • D12 Cuesports Score Board • Version 8.8',150,1030);
  return c;
}
function canvasBlob(c,type,q){return new Promise(r=>c.toBlob(r,type,q))}
async function exportScore(type){
  try{
    exportStatus('Preparing '+String(type).toUpperCase()+'…');
    const logo=await getExportLogo();
    let c=scoreCanvas(logo),base=safeFileName('d12-'+cur+'-'+new Date().toISOString().slice(0,10));
    if(type==='png'){
      let b=await canvasBlob(c,'image/png');if(!b)throw new Error('PNG export failed');downloadBlob(b,base+'.png');
    }else if(type==='jpg'){
      let b=await canvasBlob(c,'image/jpeg',.95);if(!b)throw new Error('JPG export failed');downloadBlob(b,base+'.jpg');
    }else{
      let data=c.toDataURL('image/jpeg',.94).split(',')[1],bin=atob(data),bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      let pdf=buildScorePDF(bytes,c.width,c.height);
      downloadBlob(new Blob([pdf],{type:'application/pdf'}),base+'.pdf');
    }
    exportStatus(String(type).toUpperCase()+' saved successfully.');
  }catch(e){
    console.error('D12 export error:',e);
    exportStatus('Export failed. Please try again.');
    alert('Unable to export the score. Please try again.');
  }
}

function buildScorePDF(img,w,h){
  const enc=new TextEncoder(),pw=842,ph=595,margin=24;
  const scale=Math.min((pw-margin*2)/w,(ph-margin*2)/h),dw=w*scale,dh=h*scale,x=(pw-dw)/2,y=(ph-dh)/2;
  const content='q\n'+dw.toFixed(2)+' 0 0 '+dh.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm\n/Im0 Do\nQ';
  const chunks=[],offsets=[0];
  function addText(t){chunks.push(enc.encode(t))}
  addText('%PDF-1.4\n%âãÏÓ\n');
  let pos=chunks.reduce((n,a)=>n+a.length,0);
  function addObj(num,parts){
    offsets[num]=pos;
    const htxt=num+' 0 obj\n';addText(htxt);pos+=enc.encode(htxt).length;
    for(const part of parts){if(part instanceof Uint8Array){chunks.push(part);pos+=part.length}else{addText(part);pos+=enc.encode(part).length}}
    addText('\nendobj\n');pos+=8;
  }
  addObj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  addObj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  addObj(3,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>']);
  addObj(4,['<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n',img,'\nendstream']);
  addObj(5,['<< /Length '+enc.encode(content).length+' >>\nstream\n'+content+'\nendstream']);
  const xref=pos;addText('xref\n0 6\n0000000000 65535 f \n');
  for(let i=1;i<=5;i++)addText(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
  addText('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
  const total=chunks.reduce((n,a)=>n+a.length,0),out=new Uint8Array(total);let at=0;
  for(const a of chunks){out.set(a,at);at+=a.length}
  return out;
}
